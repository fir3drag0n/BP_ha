blueprint:
  name: Contact Sensor Left Open Notification
  description: >-
    `- Version: 2.0 -`


    Notifies you when a door or window is left open, and can optionally clear the
    notification again once it is closed.

    Based on the community blueprint
    [Notification if Door or Window is left open](https://community.home-assistant.io/t/notification-if-door-or-window-is-left-open/402851)
    (2022, no longer maintained).

    For more information on the click url, see the companion docs:
    https://companion.home-assistant.io/docs/notifications/notifications-basic/#opening-a-url

    To notify multiple people, use a notify group: https://www.home-assistant.io/integrations/notify.group/
  domain: automation
  source_url: https://github.com/fir3drag0n/BP_ha/blob/main/notification-if-door-or-window-is-left-open.yaml
  input:
    entity:
      name: Entity
      description: The entity that will trigger the automation. This must be a binary sensor (e.g. binary_sensor.fridge).
      selector:
        entity:
          domain: binary_sensor
    friendly_name:
      name: Friendly Name
      description: The name used in the notification (available as {{ friendly_name }}).
      default: ""
      selector:
        text:
    issue_state:
      name: Issue State
      description: The state that triggers the automation. For a door or window sensor this is usually "on".
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
    seconds:
      name: Seconds
      description: How long (in seconds) the entity has to stay in the issue state before the notification is sent.
      default: 150
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          unit_of_measurement: seconds
          mode: slider
    notify_service:
      name: Notify Service
      description: The notify action that delivers the notification (e.g. notify.mobile_app_my_phone).
      default: notify.mobile_app_YOURDEVICE
      selector:
        text:
    click_url:
      name: Click URL
      description: Where the user is taken when tapping the notification (e.g. /lovelace/kitchen).
      default: /lovelace/ROOM
      selector:
        text:
    title:
      name: Title
      description: The title of the notification.
      default: "The {{ friendly_name }} was left open"
      selector:
        text:
    message:
      name: Message
      description: The body of the notification.
      default: "The {{ friendly_name }} was left open at {{ now().strftime('%H:%M:%S') }}."
      selector:
        text:
    notification_icon_warning:
      name: Notification Icon
      description: "Material Design icon without the mdi prefix (Android only)."
      default: alert
      selector:
        select:
          options:
            - alert
            - alert-circle
            - door
            - door-open
            - motion-sensor
            - fridge
            - fridge-alert
            - home
            - home-alert
            - home-assistant
          custom_value: true
    notification_color:
      name: Notification Color
      description: Notification color (Android only).
      default: red
      selector:
        select:
          options:
            - red
            - orange
            - yellow
            - green
            - blue
            - purple
    interruption_level:
      name: Interruption Level
      description: How intrusive the notification is (iOS only); also decides whether it is delivered during a focus mode.
      default: active
      selector:
        select:
          options:
            - passive
            - active
            - time-sensitive
            - critical
    clear_when_closed:
      name: Clear notification when closed
      description: Remove the notification from the phone as soon as the entity leaves the issue state.
      default: false
      selector:
        boolean:

mode: restart
max_exceeded: silent

variables:
  friendly_name: !input friendly_name
  entity: !input entity
  issue_state: !input issue_state
  clear_when_closed: !input clear_when_closed
  notification_icon_warning: !input notification_icon_warning

triggers:
  - trigger: state
    entity_id: !input entity
    to: !input issue_state
    for:
      seconds: !input seconds
    id: left_open
  - trigger: state
    entity_id: !input entity
    from: !input issue_state
    not_to:
      - unavailable
      - unknown
    id: closed

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: left_open
        sequence:
          - action: !input notify_service
            data:
              title: !input title
              message: !input message
              data:
                clickAction: !input click_url
                url: !input click_url
                tag: "{{ entity }}"
                color: !input notification_color
                notification_icon: "mdi:{{ notification_icon_warning }}"
                push:
                  interruption-level: !input interruption_level
      - conditions:
          - condition: trigger
            id: closed
          - condition: template
            value_template: "{{ clear_when_closed }}"
        sequence:
          - action: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ entity }}"
